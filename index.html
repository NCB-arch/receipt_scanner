<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Nalanda Doc Scanner</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #1a1a18;
    --ink2: #4a4a46;
    --ink3: #8a8a84;
    --paper: #faf9f6;
    --surface: #f2f0eb;
    --border: #dddbd4;
    --accent: #1d6b4a;
    --accent-light: #e1f5ee;
    --accent-text: #0f6e56;
    --warn: #ba7517;
    --warn-light: #faeeda;
    --danger: #a32d2d;
    --danger-light: #fcebeb;
    --radius: 14px;
    --radius-sm: 8px;
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  .topbar {
    background: var(--ink);
    color: #fff;
    padding: 16px 20px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
  .topbar-sub { font-size: 11px; color: #aaa; font-family: 'DM Mono', monospace; margin-top: 1px; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #444; flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.connected { background: #5DCB9A; box-shadow: 0 0 0 3px rgba(93,203,154,0.2); }

  .main { padding: 20px 16px 0; }

  /* API Key setup */
  .setup-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
  }
  .setup-card h2 { font-size: 13px; font-weight: 600; color: var(--ink2); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }
  .input-row { display: flex; gap: 8px; }
  .input-row input {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
  }
  .input-row input:focus { border-color: var(--accent); }
  .btn-sm {
    padding: 10px 14px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-sm:active { opacity: 0.8; transform: scale(0.98); }

  /* Sheets config */
  .sheets-config { margin-top: 12px; }
  .sheets-config label { font-size: 12px; color: var(--ink2); display: block; margin-bottom: 4px; }
  .sheets-config input {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    background: var(--paper);
    color: var(--ink);
    outline: none;
    margin-bottom: 8px;
  }
  .sheets-config input:focus { border-color: var(--accent); }

  /* Camera zone */
  .camera-zone {
    background: var(--ink);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    position: relative;
  }
  .camera-zone video {
    width: 100%; display: block;
    aspect-ratio: 4/3; object-fit: cover;
    background: #111;
  }
  .camera-zone canvas { display: none; }
  .camera-placeholder {
    aspect-ratio: 4/3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
  }
  .camera-placeholder .cam-icon {
    width: 48px; height: 48px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .camera-placeholder p { color: #888; font-size: 13px; }
  .camera-placeholder small { color: #555; font-size: 11px; font-family: 'DM Mono', monospace; }

  .preview-img {
    width: 100%; display: block;
    aspect-ratio: 4/3; object-fit: contain;
    background: #111;
  }

  /* Capture controls */
  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  .btn-capture {
    flex: 1;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: -0.2px;
  }
  .btn-capture:active { transform: scale(0.98); opacity: 0.9; }
  .btn-capture:disabled { background: #aaa; cursor: not-allowed; }
  .btn-secondary {
    padding: 14px 18px;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-secondary:active { transform: scale(0.98); }

  /* File upload fallback */
  .upload-label {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px;
    border: 1.5px dashed var(--border);
    border-radius: var(--radius);
    color: var(--ink3);
    font-size: 13px;
    cursor: pointer;
    margin-bottom: 16px;
    transition: border-color 0.2s, color 0.2s;
  }
  .upload-label:active { border-color: var(--accent); color: var(--accent-text); }
  .upload-label input { display: none; }

  /* Result card */
  .result-card {
    background: var(--paper);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 16px;
    display: none;
  }
  .result-card.show { display: block; }

  .result-header {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .doc-type-badge {
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .badge-invoice    { background: var(--accent-light); color: var(--accent-text); }
  .badge-challan    { background: #e6f1fb; color: #185fa5; }
  .badge-weighslip  { background: #faeeda; color: #854f0b; }
  .badge-receipt    { background: #fbeaf0; color: #993556; }
  .badge-po         { background: #eeedfe; color: #534ab7; }
  .badge-other      { background: var(--surface); color: var(--ink2); }

  .confidence {
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--ink3);
    margin-left: auto;
  }

  .result-fields { padding: 4px 0; }
  .field-row {
    display: flex;
    padding: 8px 16px;
    border-bottom: 1px solid var(--surface);
    gap: 8px;
  }
  .field-row:last-child { border-bottom: none; }
  .field-key {
    font-size: 12px;
    color: var(--ink3);
    min-width: 110px;
    flex-shrink: 0;
    padding-top: 1px;
    font-family: 'DM Mono', monospace;
  }
  .field-val {
    font-size: 13px;
    color: var(--ink);
    word-break: break-word;
    font-weight: 500;
  }

  .result-actions {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
  }
  .btn-save {
    flex: 1;
    padding: 12px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-save:active { transform: scale(0.98); opacity: 0.9; }
  .btn-save:disabled { background: #aaa; cursor: not-allowed; }
  .btn-retry {
    padding: 12px 16px;
    background: transparent;
    color: var(--ink2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink);
    color: #fff;
    padding: 10px 20px;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 500;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    z-index: 999;
    white-space: nowrap;
    max-width: 90vw;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.success { background: var(--accent); }
  .toast.error   { background: var(--danger); }

  /* Processing */
  .processing {
    padding: 24px 16px;
    text-align: center;
    display: none;
  }
  .processing.show { display: block; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .processing p { font-size: 13px; color: var(--ink2); }
  .processing small { font-size: 11px; color: var(--ink3); font-family: 'DM Mono', monospace; }

  /* History */
  .history-section { margin-top: 8px; }
  .section-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--ink3);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--surface);
    border-radius: var(--radius-sm);
    margin-bottom: 6px;
    font-size: 13px;
  }
  .history-item .h-type { font-weight: 500; flex: 1; }
  .history-item .h-id   { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink3); }
  .history-item .h-status { font-size: 11px; }
  .h-status.saved   { color: var(--accent-text); font-weight: 500; }
  .h-status.pending { color: var(--warn); }
  .h-status.error   { color: var(--danger); }

  .empty-history {
    text-align: center;
    padding: 24px;
    color: var(--ink3);
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">Nalanda Doc Scanner</div>
    <div class="topbar-sub">NALANDA CONCRETE BLOCKS</div>
  </div>
  <div class="status-dot" id="statusDot"></div>
</div>

<div class="main">

  <!-- API Key Setup -->
  <div class="setup-card" id="setupCard">
    <h2>Configuration</h2>
    <div class="input-row">
      <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" />
      <button class="btn-sm" onclick="saveApiKey()">Save</button>
    </div>
    <div class="sheets-config">
      <label>Google Spreadsheet ID</label>
      <input type="text" id="sheetId" placeholder="1BxiMVs0XRA5nFMdKvBdBZjgmUUqptlbs74OgVE2..." />
      <label>Sheet tab name prefix (e.g. Nalanda)</label>
      <input type="text" id="sheetPrefix" placeholder="Nalanda" value="Nalanda" />
      <button class="btn-sm" style="width:100%; margin-top:4px;" onclick="saveSheetConfig()">Save Sheet Config</button>
    </div>
  </div>

  <!-- Camera / Preview -->
  <div class="camera-zone" id="cameraZone">
    <div class="camera-placeholder" id="cameraPlaceholder" onclick="startCamera()">
      <div class="cam-icon">📷</div>
      <p>Tap to open camera</p>
      <small>or use file upload below</small>
    </div>
    <video id="video" autoplay playsinline style="display:none;"></video>
    <canvas id="canvas"></canvas>
    <img id="preview" class="preview-img" style="display:none;" />
  </div>

  <div class="controls">
    <button class="btn-capture" id="captureBtn" onclick="captureOrAnalyze()" disabled>
      Capture &amp; Scan
    </button>
    <button class="btn-secondary" id="retakeBtn" onclick="retake()" style="display:none;">Retake</button>
  </div>

  <label class="upload-label">
    <span>📁</span>
    <span>Upload image instead</span>
    <input type="file" accept="image/*" id="fileInput" onchange="handleFileUpload(event)" />
  </label>

  <!-- Processing -->
  <div class="processing" id="processing">
    <div class="spinner"></div>
    <p id="processingMsg">Analysing document...</p>
    <small id="processingStep">Sending to Claude</small>
  </div>

  <!-- Result -->
  <div class="result-card" id="resultCard">
    <div class="result-header">
      <span class="doc-type-badge" id="docTypeBadge">—</span>
      <span class="confidence" id="confidence"></span>
    </div>
    <div class="result-fields" id="resultFields"></div>
    <div class="result-actions">
      <button class="btn-save" id="saveBtn" onclick="saveToSheets()">Save to Sheets</button>
      <button class="btn-retry" onclick="retake()">New Scan</button>
    </div>
  </div>

  <!-- History -->
  <div class="history-section">
    <div class="section-label">Recent scans</div>
    <div id="historyList"><div class="empty-history">No scans yet</div></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const CLAUDE_MODEL = 'claude-sonnet-4-20250514';
let stream = null;
let capturedImage = null;
let extractedData = null;
let history = JSON.parse(localStorage.getItem('scanHistory') || '[]');

// ---- Config persistence ----
window.onload = () => {
  const k = localStorage.getItem('claudeApiKey');
  const s = localStorage.getItem('sheetId');
  const p = localStorage.getItem('sheetPrefix');
  if (k) { document.getElementById('apiKey').value = k; updateStatus(true); }
  if (s) document.getElementById('sheetId').value = s;
  if (p) document.getElementById('sheetPrefix').value = p;
  renderHistory();
};

function saveApiKey() {
  const k = document.getElementById('apiKey').value.trim();
  if (!k.startsWith('sk-')) { showToast('Enter a valid Claude API key', 'error'); return; }
  localStorage.setItem('claudeApiKey', k);
  updateStatus(true);
  showToast('API key saved', 'success');
}

function saveSheetConfig() {
  localStorage.setItem('sheetId', document.getElementById('sheetId').value.trim());
  localStorage.setItem('sheetPrefix', document.getElementById('sheetPrefix').value.trim() || 'Nalanda');
  showToast('Sheet config saved', 'success');
}

function updateStatus(ok) {
  document.getElementById('statusDot').className = 'status-dot' + (ok ? ' connected' : '');
}

// ---- Camera ----
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    document.getElementById('cameraPlaceholder').style.display = 'none';
    video.style.display = 'block';
    document.getElementById('captureBtn').disabled = false;
    document.getElementById('captureBtn').textContent = 'Capture & Scan';
  } catch(e) {
    showToast('Camera access denied — use file upload', 'error');
  }
}

async function captureOrAnalyze() {
  const video = document.getElementById('video');
  if (video.style.display !== 'none' && stream) {
    const canvas = document.getElementById('canvas');
    canvas.width  = video.videoWidth  || 1280;
    canvas.height = video.videoHeight || 720;
    canvas.getContext('2d').drawImage(video, 0, 0);
    capturedImage = canvas.toDataURL('image/jpeg', 0.92).split(',')[1];
    showPreview(canvas.toDataURL('image/jpeg', 0.92));
    stopCamera();
    await analyzeImage();
  }
}

function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async (ev) => {
    const dataUrl = ev.target.result;
    capturedImage = dataUrl.split(',')[1];
    showPreview(dataUrl);
    stopCamera();
    document.getElementById('captureBtn').disabled = false;
    await analyzeImage();
  };
  reader.readAsDataURL(file);
}

function showPreview(dataUrl) {
  const preview = document.getElementById('preview');
  preview.src = dataUrl;
  preview.style.display = 'block';
  document.getElementById('cameraPlaceholder').style.display = 'none';
  document.getElementById('video').style.display = 'none';
  document.getElementById('captureBtn').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'block';
}

function stopCamera() {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function retake() {
  stopCamera();
  capturedImage = null; extractedData = null;
  document.getElementById('preview').style.display = 'none';
  document.getElementById('cameraPlaceholder').style.display = 'flex';
  document.getElementById('captureBtn').style.display = 'block';
  document.getElementById('captureBtn').disabled = true;
  document.getElementById('captureBtn').textContent = 'Capture & Scan';
  document.getElementById('retakeBtn').style.display = 'none';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('processing').classList.remove('show');
  document.getElementById('fileInput').value = '';
}

// ---- Claude Analysis ----
const DOC_TYPE_PROMPT = `You are a business document scanner for Nalanda Concrete Blocks, a construction materials company in Bengaluru, India.

Analyse this document image and respond ONLY with a valid JSON object — no markdown, no explanation, just pure JSON.

Identify the document type from:
- TAX_INVOICE (GST invoice from supplier)
- DELIVERY_CHALLAN (delivery/dispatch challan)
- WEIGH_SLIP (weigh bridge ticket / RST)
- PURCHASE_INVOICE (purchase bill)
- SALES_INVOICE (sales bill to customer)
- RECEIPT (payment receipt)
- PURCHASE_ORDER (PO)
- CREDIT_NOTE
- DEBIT_NOTE
- OTHER

Extract ALL relevant fields visible. Common fields: invoice_number, invoice_date, supplier_name, supplier_gstin, buyer_name, buyer_gstin, vehicle_number, gross_weight_kg, tare_weight_kg, net_weight_kg, material, quantity_to, unit_price, basic_amount, cgst, sgst, igst, total_amount, rst_number, truck_number, date, time, place_of_supply.

Only include fields actually present in the document.

Return exactly this JSON structure:
{
  "doc_type": "TAX_INVOICE",
  "confidence": "HIGH",
  "fields": {
    "field_name": "value",
    ...
  }
}

Confidence: HIGH if document is clear, MEDIUM if partially visible, LOW if uncertain.`;

async function analyzeImage() {
  const apiKey = localStorage.getItem('claudeApiKey');
  if (!apiKey) { showToast('Add your API key first', 'error'); return; }
  if (!capturedImage) return;

  document.getElementById('processing').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  setProcessingMsg('Analysing document...', 'Sending to Claude API');

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01'
      },
      body: JSON.stringify({
        model: CLAUDE_MODEL,
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: capturedImage } },
            { type: 'text', text: DOC_TYPE_PROMPT }
          ]
        }]
      })
    });

    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.error?.message || 'API error ' + res.status);
    }

    const data = await res.json();
    const raw = data.content[0].text.trim();
    const cleaned = raw.replace(/^```json\s*/,'').replace(/```\s*$/,'').trim();
    extractedData = JSON.parse(cleaned);
    document.getElementById('processing').classList.remove('show');
    renderResult(extractedData);
  } catch(e) {
    document.getElementById('processing').classList.remove('show');
    showToast('Error: ' + e.message, 'error');
    console.error(e);
  }
}

function setProcessingMsg(msg, step) {
  document.getElementById('processingMsg').textContent = msg;
  document.getElementById('processingStep').textContent = step;
}

// ---- Render Result ----
const badgeClass = {
  TAX_INVOICE: 'badge-invoice', PURCHASE_INVOICE: 'badge-invoice',
  SALES_INVOICE: 'badge-invoice', DELIVERY_CHALLAN: 'badge-challan',
  WEIGH_SLIP: 'badge-weighslip', RECEIPT: 'badge-receipt',
  PURCHASE_ORDER: 'badge-po', OTHER: 'badge-other',
  CREDIT_NOTE: 'badge-receipt', DEBIT_NOTE: 'badge-receipt'
};
const docLabel = {
  TAX_INVOICE: 'Tax Invoice', PURCHASE_INVOICE: 'Purchase Invoice',
  SALES_INVOICE: 'Sales Invoice', DELIVERY_CHALLAN: 'Delivery Challan',
  WEIGH_SLIP: 'Weigh Slip', RECEIPT: 'Receipt',
  PURCHASE_ORDER: 'Purchase Order', CREDIT_NOTE: 'Credit Note',
  DEBIT_NOTE: 'Debit Note', OTHER: 'Other Document'
};

function renderResult(data) {
  const badge = document.getElementById('docTypeBadge');
  badge.textContent = docLabel[data.doc_type] || data.doc_type;
  badge.className = 'doc-type-badge ' + (badgeClass[data.doc_type] || 'badge-other');

  document.getElementById('confidence').textContent = data.confidence + ' confidence';

  const fields = document.getElementById('resultFields');
  fields.innerHTML = '';
  Object.entries(data.fields || {}).forEach(([k, v]) => {
    const row = document.createElement('div');
    row.className = 'field-row';
    const key = k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase());
    row.innerHTML = '<span class="field-key">' + key + '</span><span class="field-val">' + v + '</span>';
    fields.appendChild(row);
  });

  document.getElementById('resultCard').classList.add('show');
}

// ---- Save to Google Sheets ----
async function saveToSheets() {
  const sheetId = localStorage.getItem('sheetId');
  const prefix  = localStorage.getItem('sheetPrefix') || 'Nalanda';
  if (!sheetId) { showToast('Add your Spreadsheet ID first', 'error'); return; }
  if (!extractedData) return;

  document.getElementById('saveBtn').disabled = true;
  document.getElementById('saveBtn').textContent = 'Saving...';

  const sheetName = prefix + ' - ' + (docLabel[extractedData.doc_type] || 'Other');
  const timestamp = new Date().toLocaleString('en-IN');
  const row = [timestamp, extractedData.doc_type, extractedData.confidence, ...Object.values(extractedData.fields || {})];
  const headers = ['Scanned At', 'Document Type', 'Confidence', ...Object.keys(extractedData.fields || {}).map(k => k.replace(/_/g,' ').replace(/\b\w/g, c => c.toUpperCase()))];

  try {
    // Try to append via Sheets API
    const apiKey = localStorage.getItem('claudeApiKey');
    // We'll store the pending save and show the data for manual copy if Sheets API unavailable
    const entry = { id: Date.now(), type: docLabel[extractedData.doc_type], sheetName, row, headers, status: 'pending', ts: timestamp };
    history.unshift(entry);
    localStorage.setItem('scanHistory', JSON.stringify(history.slice(0, 50)));

    // Show clipboard fallback with the data
    const csvRow = row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',');
    showSaveModal(sheetName, headers, row, entry.id);
  } catch(e) {
    showToast('Save failed: ' + e.message, 'error');
  }

  document.getElementById('saveBtn').disabled = false;
  document.getElementById('saveBtn').textContent = 'Save to Sheets';
  renderHistory();
}

function showSaveModal(sheetName, headers, row, id) {
  const existing = document.getElementById('saveModal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'saveModal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:100;display:flex;align-items:flex-end;';

  const rows = headers.map((h,i) => '<tr><td style="padding:6px 12px;font-size:12px;color:#888;font-family:monospace;">' + h + '</td><td style="padding:6px 12px;font-size:13px;font-weight:500;word-break:break-all;">' + (row[i] || '') + '</td></tr>').join('');
  const csv = row.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',');

  modal.innerHTML = '<div style="background:#faf9f6;border-radius:20px 20px 0 0;width:100%;max-height:80vh;overflow-y:auto;padding:20px 16px 32px;">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">' +
    '<div><div style="font-size:14px;font-weight:600;">Ready to save</div>' +
    '<div style="font-size:11px;color:#888;font-family:monospace;margin-top:2px;">Sheet: ' + sheetName + '</div></div>' +
    '<button onclick="document.getElementById('saveModal').remove()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#888;">×</button></div>' +
    '<table style="width:100%;border-collapse:collapse;background:#f2f0eb;border-radius:10px;overflow:hidden;margin-bottom:16px;">' + rows + '</table>' +
    '<button onclick="navigator.clipboard.writeText('' + csv.replace(/'/g, "\'") + '').then(()=>showToast('Row copied!','success'))" style="width:100%;padding:13px;background:#1d6b4a;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;margin-bottom:8px;">Copy row as CSV</button>' +
    '<div style="font-size:11px;color:#aaa;text-align:center;">Paste this row into the '' + sheetName + '' tab in your Google Sheet</div>' +
    '</div>';

  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  markHistorySaved(id);
}

function markHistorySaved(id) {
  history = history.map(h => h.id === id ? {...h, status: 'saved'} : h);
  localStorage.setItem('scanHistory', JSON.stringify(history));
  renderHistory();
}

// ---- History ----
function renderHistory() {
  const list = document.getElementById('historyList');
  if (!history.length) { list.innerHTML = '<div class="empty-history">No scans yet</div>'; return; }
  list.innerHTML = history.slice(0, 8).map(h =>
    '<div class="history-item">' +
    '<span class="h-type">' + h.type + '</span>' +
    '<span class="h-id">' + new Date(h.id).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit'}) + '</span>' +
    '<span class="h-status ' + h.status + '">' + (h.status === 'saved' ? '✓ saved' : h.status === 'error' ? '✗ error' : '● pending') + '</span>' +
    '</div>'
  ).join('');
}

// ---- Toast ----
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + (type || '');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
</script>
</body>
</html>
