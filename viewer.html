<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nalanda Docs</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0d;--surface:#1a1a16;--surface2:#232320;--border:#2e2e28;--text:#f0ede6;--text2:#9a9690;--text3:#5a5a52;--accent:#e8c84a;--green:#4aaa6e;--blue:#4a8be8;--orange:#e87a4a;--purple:#9b6ae8;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* Header */
.header{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--bg);z-index:100;gap:12px}
.logo{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo-mark{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#000}
.logo-text{font-size:15px;font-weight:700;letter-spacing:-.3px}
.logo-sub{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:1px}
.total-badge{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);background:var(--surface2);padding:4px 10px;border-radius:20px;border:1px solid var(--border);white-space:nowrap}

/* Config */
.config-bar{padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.config-bar input{flex:1;min-width:200px;padding:8px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'DM Mono',monospace;font-size:11px;outline:none}
.config-bar input:focus{border-color:var(--accent)}
.config-bar input::placeholder{color:var(--text3)}
.btn-load{padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-load:active{opacity:.8}

/* Tabs */
.page-tabs{display:none;padding:0 20px;border-bottom:1px solid var(--border);gap:0}
.page-tabs.show{display:flex}
.ptab{padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.ptab:hover{color:var(--text)}
.ptab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Pages */
.page{display:none}
.page.active{display:block}

/* ── VIEWER PAGE ── */
.search-bar{padding:10px 20px;border-bottom:1px solid var(--border)}
.search-input-wrap{position:relative}
.search-input-wrap input{width:100%;padding:10px 16px 10px 40px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none}
.search-input-wrap input:focus{border-color:var(--accent)}
.search-input-wrap input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:2px;display:none}

.stats{display:flex;gap:12px;padding:10px 20px;border-bottom:1px solid var(--border);overflow-x:auto}
.stat{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.stat-val{font-size:20px;font-weight:800;color:var(--accent)}
.stat-label{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase}

.filters{padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--border);align-items:center}
.filter-label{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-right:4px}
.tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);font-family:'Syne',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.tab:hover{border-color:var(--text2);color:var(--text)}
.tab.active{color:#000;border-color:transparent}
.tab.t-all.active{background:var(--accent)}
.tab.t-bharathi.active{background:var(--green)}
.tab.t-nalanda.active{background:var(--blue)}
.tab.t-mr.active{background:var(--orange)}
.tab.t-delivery.active{background:var(--purple)}
.month-select{padding:5px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;outline:none;cursor:pointer;margin-left:auto}
.month-select option{background:var(--surface2)}

.grid-wrap{padding:16px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.doc-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .15s,border-color .15s}
.doc-card:hover{transform:translateY(-2px);border-color:var(--text3)}
.doc-thumb-wrap{position:relative;width:100%;aspect-ratio:3/4;background:var(--surface2);overflow:hidden}
.doc-thumb{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .3s}
.doc-thumb.loaded{opacity:1}
.doc-thumb-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--text3)}
.doc-info{padding:8px 10px}
.doc-type{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px;font-family:'DM Mono',monospace}
.doc-type.t-bharathi{color:var(--green)}
.doc-type.t-nalanda{color:var(--blue)}
.doc-type.t-mr{color:var(--orange)}
.doc-type.t-delivery{color:var(--purple)}
.doc-name{font-size:11px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-date{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:2px}
.search-highlight{background:rgba(232,200,74,.25);border-radius:2px;padding:0 1px}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty p{font-size:14px}
.empty small{font-size:12px;font-family:'DM Mono',monospace;margin-top:4px;display:block}
.loading{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.spinner{width:32px;height:32px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.load-more-wrap{padding:16px 20px;text-align:center;display:none}
.btn-more{padding:10px 28px;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--text2);font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.btn-more:hover{border-color:var(--accent);color:var(--accent)}
.load-more-info{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;margin-top:8px}

/* ── DASHBOARD PAGE ── */
.dash-wrap{padding:20px}
.dash-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
.dash-toolbar select,.dash-toolbar input[type=date]{padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-family:'DM Mono',monospace;font-size:12px;outline:none}
.dash-toolbar select:focus,.dash-toolbar input[type=date]:focus{border-color:var(--accent)}
.dash-toolbar select option{background:var(--surface2)}
.dash-label{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace;align-self:center}
.btn-apply{padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:8px;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;cursor:pointer}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px}
.kpi-val{font-size:28px;font-weight:800;margin-bottom:4px}
.kpi-label{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase}
.kpi-sub{font-size:11px;color:var(--text3);margin-top:4px}

.dash-section{margin-bottom:24px}
.dash-section-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;font-family:'DM Mono',monospace}

/* Tables */
.dash-table{width:100%;border-collapse:collapse;font-size:13px}
.dash-table th{text-align:left;padding:8px 12px;font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);font-weight:600}
.dash-table td{padding:9px 12px;border-bottom:1px solid var(--surface2);color:var(--text2)}
.dash-table tr:last-child td{border-bottom:none}
.dash-table tr:hover td{background:var(--surface2);color:var(--text)}
.dash-table .num{font-family:'DM Mono',monospace;font-weight:600;color:var(--text)}
.dash-table .bar-cell{width:120px}
.mini-bar{height:6px;background:var(--accent);border-radius:3px;min-width:2px}
.dash-table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}

.type-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}

/* Lightbox */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;display:none;flex-direction:column;align-items:center;justify-content:center}
.lightbox.show{display:flex}
.lightbox-header{position:absolute;top:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(to bottom,rgba(0,0,0,.8),transparent)}
.lightbox-title{font-size:13px;font-weight:600;color:#fff}
.lightbox-meta{font-size:11px;color:rgba(255,255,255,.5);font-family:'DM Mono',monospace;margin-top:2px}
.lb-close{background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lb-close:hover{background:rgba(255,255,255,.2)}
.lightbox-img{max-width:90vw;max-height:80vh;object-fit:contain;border-radius:8px}
.lightbox-nav{position:absolute;bottom:0;left:0;right:0;padding:16px 20px;display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent)}
.lb-btn{padding:8px 20px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:20px;font-family:'Syne',sans-serif;font-size:13px;font-weight:600;cursor:pointer}
.lb-btn:hover{background:rgba(255,255,255,.2)}
.lb-btn:disabled{opacity:.3;cursor:not-allowed}
.lb-counter{font-family:'DM Mono',monospace;font-size:12px;color:rgba(255,255,255,.5);min-width:60px;text-align:center}
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">N</div>
    <div><div class="logo-text">Nalanda Docs</div><div class="logo-sub">DOCUMENT VIEWER</div></div>
  </div>
  <div class="total-badge" id="totalBadge">0 docs</div>
</div>

<div class="config-bar">
  <input type="text" id="workerUrl" placeholder="Worker URL — https://nalanda-sheets-proxy.nalandaconcreteblocks.workers.dev" />
  <button class="btn-load" onclick="loadDocs()">Load</button>
</div>

<!-- Page tabs -->
<div class="page-tabs" id="pageTabs">
  <button class="ptab active" onclick="switchPage('viewer',this)">📁 Documents</button>
  <button class="ptab" onclick="switchPage('dashboard',this)">📊 Dashboard</button>
</div>

<!-- ── VIEWER PAGE ── -->
<div class="page active" id="page-viewer">
  <div class="search-bar">
    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search vehicle no, invoice no, RST no..." oninput="onSearch()"/>
      <button class="search-clear" id="searchClear" onclick="clearSearch()">×</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-val" id="statTotal">0</div><div class="stat-label">Total</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--green)" id="statBharathi">0</div><div class="stat-label">Bharathi</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--blue)" id="statNalanda">0</div><div class="stat-label">Nalanda</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--orange)" id="statMR">0</div><div class="stat-label">MR Ent.</div></div>
    <div class="stat"><div class="stat-val" style="color:var(--purple)" id="statDelivery">0</div><div class="stat-label">Delivery</div></div>
  </div>
  <div class="filters">
    <span class="filter-label">TYPE</span>
    <button class="tab t-all active" onclick="setType('all',this)">All</button>
    <button class="tab t-bharathi" onclick="setType('Bharathi Invoices',this)">Bharathi</button>
    <button class="tab t-nalanda"  onclick="setType('Nalanda Weighment Slips',this)">Nalanda</button>
    <button class="tab t-mr"       onclick="setType('MR Enterprises',this)">MR Ent.</button>
    <button class="tab t-delivery" onclick="setType('Delivery Challans',this)">Delivery</button>
    <select class="month-select" id="monthSelect" onchange="applyFilters()">
      <option value="all">All months</option>
    </select>
  </div>
  <div class="grid-wrap">
    <div class="grid" id="grid">
      <div class="empty"><div class="empty-icon">📁</div><p>Enter your Worker URL above and click Load</p></div>
    </div>
  </div>
  <div class="load-more-wrap" id="loadMoreWrap">
    <button class="btn-more" onclick="loadMore()">Load more</button>
    <div class="load-more-info" id="loadMoreInfo"></div>
  </div>
</div>

<!-- ── DASHBOARD PAGE ── -->
<div class="page" id="page-dashboard">
  <div class="dash-wrap">

    <div class="dash-toolbar">
      <span class="dash-label">View by</span>
      <select id="dashView" onchange="renderDash()">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly" selected>Monthly</option>
        <option value="custom">Custom range</option>
      </select>
      <span class="dash-label" id="customLabel" style="display:none">From</span>
      <input type="date" id="dateFrom" style="display:none" onchange="renderDash()"/>
      <span class="dash-label" id="customLabel2" style="display:none">To</span>
      <input type="date" id="dateTo" style="display:none" onchange="renderDash()"/>
      <select id="dashType" onchange="renderDash()">
        <option value="all">All types</option>
        <option value="Bharathi Invoices">Bharathi</option>
        <option value="Nalanda Weighment Slips">Nalanda</option>
        <option value="MR Enterprises">MR Enterprises</option>
        <option value="Delivery Challans">Delivery Challans</option>
      </select>
    </div>

    <!-- KPIs -->
    <div class="kpi-row" id="kpiRow"></div>

    <!-- Main count table -->
    <div class="dash-section">
      <div class="dash-section-title" id="dashTableTitle">Monthly breakdown</div>
      <div class="dash-table-wrap">
        <table class="dash-table" id="dashTable">
          <thead><tr id="dashTableHead"></tr></thead>
          <tbody id="dashTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- By doc type breakdown -->
    <div class="dash-section">
      <div class="dash-section-title">By document type</div>
      <div class="dash-table-wrap">
        <table class="dash-table" id="typeTable">
          <thead><tr><th>Type</th><th>Count</th><th class="bar-cell"></th></tr></thead>
          <tbody id="typeTableBody"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="lbBgClick(event)">
  <div class="lightbox-header">
    <div><div class="lightbox-title" id="lbTitle"></div><div class="lightbox-meta" id="lbMeta"></div></div>
    <button class="lb-close" onclick="closeLb()">×</button>
  </div>
  <img class="lightbox-img" id="lbImg" src="" alt="">
  <div class="lightbox-nav">
    <button class="lb-btn" id="lbPrev" onclick="lbNav(-1)">← Prev</button>
    <span class="lb-counter" id="lbCounter"></span>
    <button class="lb-btn" id="lbNext" onclick="lbNav(1)">Next →</button>
  </div>
</div>

<script>
var WORKER_URL = "";
var PAGE_SIZE  = 50;
var allDocs    = [];
var filtered   = [];
var displayed  = 0;
var currentType  = "all";
var currentMonth = "all";
var searchQuery  = "";
var lbIndex = 0;
var observer;

// ── Boot ───────────────────────────────────────────────
window.onload = function() {
  var saved = localStorage.getItem("nalanda_worker_url");
  if (saved) { document.getElementById("workerUrl").value = saved; WORKER_URL = saved; loadDocs(); }
  setupObserver();
  // Set default date range to this month
  var now = new Date();
  var y = now.getFullYear(), m = String(now.getMonth()+1).padStart(2,"0");
  var firstDay = y + "-" + m + "-01";
  var lastDay  = y + "-" + m + "-" + String(new Date(y, now.getMonth()+1, 0).getDate()).padStart(2,"0");
  document.getElementById("dateFrom").value = firstDay;
  document.getElementById("dateTo").value   = lastDay;
};

// ── Page switching ─────────────────────────────────────
function switchPage(name, btn) {
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("active"); });
  document.querySelectorAll(".ptab").forEach(function(t){ t.classList.remove("active"); });
  document.getElementById("page-" + name).classList.add("active");
  btn.classList.add("active");
  if (name === "dashboard") renderDash();
}

// ── Lazy load observer ─────────────────────────────────
function setupObserver() {
  observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      if (e.isIntersecting) {
        var img = e.target;
        if (img.dataset.src) {
          img.src = img.dataset.src;
          img.onload  = function(){ img.classList.add("loaded"); };
          img.onerror = function(){ img.style.display="none"; var ph=img.nextElementSibling; if(ph) ph.style.display="flex"; };
          delete img.dataset.src;
          observer.unobserve(img);
        }
      }
    });
  }, { rootMargin: "200px" });
}

// ── Load docs ──────────────────────────────────────────
async function loadDocs() {
  var url = document.getElementById("workerUrl").value.trim();
  if (!url) { alert("Enter your Worker URL first"); return; }
  if (!url.startsWith("http")) url = "https://" + url;
  WORKER_URL = url.replace(/\/$/, "");
  localStorage.setItem("nalanda_worker_url", WORKER_URL);
  showLoading();
  try {
    var res = await fetch(WORKER_URL + "/list");
    if (!res.ok) throw new Error("Could not reach Worker (status " + res.status + ")");
    var data = await res.json();
    if (data.error) throw new Error(data.error);
    var keys = (data.keys || []).map(function(k){ return k.key || k; });
    if (keys.length === 0) { showEmpty("No documents yet — send images to the bot first!"); return; }
    allDocs = keys.map(parseKey).filter(Boolean).reverse();
    buildMonthFilter();
    updateStats();
    document.getElementById("pageTabs").classList.add("show");
    applyFilters();
  } catch(e) { showEmpty("Error: " + e.message); }
}

function parseKey(key) {
  var parts = key.split("/");
  if (parts.length < 3) return null;
  var docType  = parts[0];
  var month    = parts[1];
  var filename = parts.slice(2).join("/");
  // Extract date from filename e.g. 27-04-2026
  var dateMatch = filename.match(/(\d{2})-(\d{2})-(\d{4})/);
  var dateObj = null;
  if (dateMatch) {
    dateObj = new Date(parseInt(dateMatch[3]), parseInt(dateMatch[2])-1, parseInt(dateMatch[1]));
  }
  return { key, docType, month, filename, url: WORKER_URL + "/img?key=" + encodeURIComponent(key), dateObj };
}

// ── Viewer filters ─────────────────────────────────────
function setType(type, btn) {
  currentType = type;
  document.querySelectorAll(".tab").forEach(function(t){ t.classList.remove("active"); });
  btn.classList.add("active");
  applyFilters();
}

function onSearch() {
  searchQuery = document.getElementById("searchInput").value.trim().toLowerCase();
  document.getElementById("searchClear").style.display = searchQuery ? "block" : "none";
  applyFilters();
}

function clearSearch() {
  document.getElementById("searchInput").value = "";
  searchQuery = "";
  document.getElementById("searchClear").style.display = "none";
  applyFilters();
}

function applyFilters() {
  currentMonth = document.getElementById("monthSelect").value;
  filtered = allDocs.filter(function(d) {
    var typeOk  = currentType === "all" || d.docType === currentType;
    var monthOk = currentMonth === "all" || d.month === currentMonth;
    var searchOk = !searchQuery || d.filename.toLowerCase().includes(searchQuery) || d.key.toLowerCase().includes(searchQuery);
    return typeOk && monthOk && searchOk;
  });
  displayed = 0;
  document.getElementById("grid").innerHTML = "";
  renderNext();
  document.getElementById("totalBadge").textContent = filtered.length + " docs";
}

function renderNext() {
  var grid  = document.getElementById("grid");
  var start = displayed;
  var end   = Math.min(displayed + PAGE_SIZE, filtered.length);
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>No documents match</p></div>';
    document.getElementById("loadMoreWrap").style.display = "none";
    return;
  }
  for (var i = start; i < end; i++) grid.appendChild(makeCard(filtered[i], i));
  displayed = end;
  var wrap = document.getElementById("loadMoreWrap");
  if (displayed < filtered.length) {
    wrap.style.display = "block";
    document.getElementById("loadMoreInfo").textContent = "Showing " + displayed + " of " + filtered.length + " documents";
  } else { wrap.style.display = "none"; }
}

function loadMore() { renderNext(); }

function makeCard(doc, idx) {
  var tc   = getTypeClass(doc.docType);
  var ts   = getTypeShort(doc.docType);
  var name = doc.filename.replace(/\.[^.]+$/, "").replace(/_/g, " ");
  var dateMatch = doc.filename.match(/(\d{2}-\d{2}-\d{4})/);
  var date = dateMatch ? dateMatch[1] : doc.month;
  var displayName = name;
  if (searchQuery) {
    var re = new RegExp("(" + searchQuery.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
    displayName = name.replace(re, '<span class="search-highlight">$1</span>');
  }
  var card = document.createElement("div");
  card.className = "doc-card";
  card.onclick = function(){ openLb(idx); };
  card.innerHTML =
    '<div class="doc-thumb-wrap">' +
      '<img class="doc-thumb" data-src="' + doc.url + '" alt="' + name + '">' +
      '<div class="doc-thumb-placeholder">' + getEmoji(doc.docType) + '</div>' +
    '</div>' +
    '<div class="doc-info">' +
      '<div class="doc-type ' + tc + '">' + ts + '</div>' +
      '<div class="doc-name">' + displayName + '</div>' +
      '<div class="doc-date">' + date + '</div>' +
    '</div>';
  observer.observe(card.querySelector(".doc-thumb"));
  return card;
}

// ── Stats ──────────────────────────────────────────────
function updateStats() {
  document.getElementById("statTotal").textContent    = allDocs.length;
  document.getElementById("statBharathi").textContent = allDocs.filter(function(d){return d.docType.includes("Bharathi");}).length;
  document.getElementById("statNalanda").textContent  = allDocs.filter(function(d){return d.docType.includes("Nalanda");}).length;
  document.getElementById("statMR").textContent       = allDocs.filter(function(d){return d.docType.includes("MR");}).length;
  document.getElementById("statDelivery").textContent = allDocs.filter(function(d){return d.docType.includes("Delivery");}).length;
}

function buildMonthFilter() {
  var months = [];
  allDocs.forEach(function(d){ if (!months.includes(d.month)) months.push(d.month); });
  months.sort().reverse();
  var sel = document.getElementById("monthSelect");
  sel.innerHTML = '<option value="all">All months</option>';
  months.forEach(function(m){
    var opt = document.createElement("option");
    opt.value = m; opt.textContent = m;
    sel.appendChild(opt);
  });
}

// ── DASHBOARD ──────────────────────────────────────────
function renderDash() {
  var view     = document.getElementById("dashView").value;
  var typeFilter = document.getElementById("dashType").value;
  var dateFrom = document.getElementById("dateFrom").value;
  var dateTo   = document.getElementById("dateTo").value;

  // Show/hide custom date inputs
  var isCustom = view === "custom";
  document.getElementById("dateFrom").style.display     = isCustom ? "block" : "none";
  document.getElementById("dateTo").style.display       = isCustom ? "block" : "none";
  document.getElementById("customLabel").style.display  = isCustom ? "inline" : "none";
  document.getElementById("customLabel2").style.display = isCustom ? "inline" : "none";

  // Filter docs by type
  var docs = typeFilter === "all" ? allDocs : allDocs.filter(function(d){ return d.docType === typeFilter; });

  // Filter by date range for custom
  if (isCustom && dateFrom && dateTo) {
    var from = new Date(dateFrom);
    var to   = new Date(dateTo);
    to.setHours(23,59,59);
    docs = docs.filter(function(d){ return d.dateObj && d.dateObj >= from && d.dateObj <= to; });
  }

  // Build period groups
  var groups = {};
  docs.forEach(function(d) {
    var key = getPeriodKey(d, view, dateFrom, dateTo);
    if (!key) return;
    if (!groups[key]) groups[key] = { total:0, bharathi:0, nalanda:0, mr:0, delivery:0 };
    groups[key].total++;
    if (d.docType.includes("Bharathi")) groups[key].bharathi++;
    else if (d.docType.includes("Nalanda")) groups[key].nalanda++;
    else if (d.docType.includes("MR")) groups[key].mr++;
    else if (d.docType.includes("Delivery")) groups[key].delivery++;
  });

  // Sort periods
  var periods = Object.keys(groups).sort().reverse();

  // KPIs
  var total   = docs.length;
  var maxDay  = 0; var maxPeriod = "-";
  periods.forEach(function(p){ if(groups[p].total > maxDay){ maxDay=groups[p].total; maxPeriod=p; } });
  var avg = periods.length > 0 ? (total / periods.length).toFixed(1) : 0;

  var kpiData = [
    { val: total,     label: "Total docs",      sub: "in selected range", color: "var(--accent)" },
    { val: maxDay,    label: "Busiest period",   sub: maxPeriod,           color: "var(--green)"  },
    { val: avg,       label: "Avg per period",   sub: view,                color: "var(--blue)"   },
    { val: periods.length, label: "Periods",     sub: "with documents",    color: "var(--orange)" }
  ];
  document.getElementById("kpiRow").innerHTML = kpiData.map(function(k){
    return '<div class="kpi"><div class="kpi-val" style="color:' + k.color + '">' + k.val + '</div>' +
           '<div class="kpi-label">' + k.label + '</div><div class="kpi-sub">' + k.sub + '</div></div>';
  }).join("");

  // Main table
  var title = view.charAt(0).toUpperCase() + view.slice(1) + " breakdown";
  document.getElementById("dashTableTitle").textContent = title;
  var thead = document.getElementById("dashTableHead");
  var tbody = document.getElementById("dashTableBody");
  thead.innerHTML = "<th>Period</th><th>Total</th><th>Bharathi</th><th>Nalanda</th><th>MR Ent.</th><th>Delivery</th><th class='bar-cell'></th>";
  var maxVal = Math.max.apply(null, periods.map(function(p){ return groups[p].total; })) || 1;
  tbody.innerHTML = periods.map(function(p){
    var g = groups[p];
    var barW = Math.round((g.total / maxVal) * 100);
    return "<tr>" +
      "<td>" + p + "</td>" +
      "<td class='num'>" + g.total + "</td>" +
      "<td class='num' style='color:var(--green)'>" + (g.bharathi||"-") + "</td>" +
      "<td class='num' style='color:var(--blue)'>"  + (g.nalanda||"-") + "</td>" +
      "<td class='num' style='color:var(--orange)'>"+ (g.mr||"-") + "</td>" +
      "<td class='num' style='color:var(--purple)'>"+ (g.delivery||"-") + "</td>" +
      "<td class='bar-cell'><div class='mini-bar' style='width:" + barW + "%'></div></td>" +
      "</tr>";
  }).join("") || "<tr><td colspan='7' style='text-align:center;color:var(--text3);padding:20px'>No data for selected range</td></tr>";

  // Type breakdown
  var typeCounts = [
    { name:"Bharathi Invoices",       count: docs.filter(function(d){return d.docType.includes("Bharathi");}).length, color:"var(--green)"  },
    { name:"Nalanda Weighment Slips", count: docs.filter(function(d){return d.docType.includes("Nalanda");}).length,  color:"var(--blue)"   },
    { name:"MR Enterprises",          count: docs.filter(function(d){return d.docType.includes("MR");}).length,       color:"var(--orange)" },
    { name:"Delivery Challans",       count: docs.filter(function(d){return d.docType.includes("Delivery");}).length, color:"var(--purple)" }
  ].filter(function(t){ return t.count > 0; }).sort(function(a,b){ return b.count-a.count; });
  var maxType = typeCounts.length > 0 ? typeCounts[0].count : 1;
  document.getElementById("typeTableBody").innerHTML = typeCounts.map(function(t){
    var barW = Math.round((t.count / maxType) * 100);
    return "<tr>" +
      "<td><span class='type-dot' style='background:" + t.color + "'></span>" + t.name + "</td>" +
      "<td class='num'>" + t.count + "</td>" +
      "<td class='bar-cell'><div class='mini-bar' style='width:" + barW + "%;background:" + t.color + "'></div></td>" +
      "</tr>";
  }).join("") || "<tr><td colspan='3' style='text-align:center;color:var(--text3);padding:20px'>No data</td></tr>";
}

function getPeriodKey(doc, view, dateFrom, dateTo) {
  if (view === "monthly") return doc.month || null;

  var d = doc.dateObj;
  if (!d || isNaN(d.getTime())) return null;

  if (view === "custom") {
    if (!dateFrom || !dateTo) return doc.month || null;
    var from = new Date(dateFrom), to = new Date(dateTo);
    to.setHours(23,59,59);
    if (d < from || d > to) return null;
    return d.getDate() + "-" + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()];
  }

  if (view === "daily") {
    return String(d.getDate()).padStart(2,"0") + "-" +
           ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] + "-" +
           d.getFullYear();
  }

  if (view === "weekly") {
    // ISO week
    var jan1 = new Date(d.getFullYear(), 0, 1);
    var week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
    return "W" + String(week).padStart(2,"0") + " " + d.getFullYear();
  }

  return doc.month || null;
}

// ── Lightbox ───────────────────────────────────────────
function openLb(i) { lbIndex=i; updateLb(); document.getElementById("lightbox").classList.add("show"); }
function updateLb() {
  var doc  = filtered[lbIndex];
  var name = doc.filename.replace(/\.[^.]+$/,"").replace(/_/g," ");
  document.getElementById("lbImg").src = doc.url;
  document.getElementById("lbTitle").textContent   = getTypeShort(doc.docType);
  document.getElementById("lbMeta").textContent    = name + " · " + doc.month;
  document.getElementById("lbCounter").textContent = (lbIndex+1) + " / " + filtered.length;
  document.getElementById("lbPrev").disabled = lbIndex === 0;
  document.getElementById("lbNext").disabled = lbIndex === filtered.length-1;
}
function lbNav(dir) { lbIndex=Math.max(0,Math.min(filtered.length-1,lbIndex+dir)); if(lbIndex>=displayed-5) renderNext(); updateLb(); }
function lbBgClick(e) { if(e.target===document.getElementById("lightbox")) closeLb(); }
function closeLb()    { document.getElementById("lightbox").classList.remove("show"); }
document.addEventListener("keydown",function(e){
  if(!document.getElementById("lightbox").classList.contains("show")) return;
  if(e.key==="ArrowRight") lbNav(1);
  if(e.key==="ArrowLeft")  lbNav(-1);
  if(e.key==="Escape")     closeLb();
});

// ── Helpers ────────────────────────────────────────────
function getTypeClass(t){ return t.includes("Bharathi")?"t-bharathi":t.includes("Nalanda")?"t-nalanda":t.includes("MR")?"t-mr":t.includes("Delivery")?"t-delivery":"t-bharathi"; }
function getTypeShort(t){ return t.includes("Bharathi")?"Bharathi Invoice":t.includes("Nalanda")?"Nalanda Weigh Slip":t.includes("MR")?"MR Enterprises":t.includes("Delivery")?"Delivery Challan":t; }
function getEmoji(t)    { return t.includes("Bharathi")?"🧾":t.includes("Nalanda")?"⚖️":t.includes("MR")?"📝":t.includes("Delivery")?"🚛":"📄"; }
function showLoading()  { document.getElementById("grid").innerHTML='<div class="loading"><div class="spinner"></div><p style="font-size:13px;color:var(--text3)">Loading...</p></div>'; document.getElementById("loadMoreWrap").style.display="none"; }
function showEmpty(msg) { document.getElementById("grid").innerHTML='<div class="empty"><div class="empty-icon">📭</div><p>'+msg+'</p></div>'; document.getElementById("loadMoreWrap").style.display="none"; }
</script>
