<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Nalanda Doc Scanner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1a1a18;--ink2:#4a4a46;--ink3:#8a8a84;--paper:#faf9f6;--surface:#f2f0eb;--border:#dddbd4;--accent:#1d6b4a;--al:#e1f5ee;--at:#0f6e56;--danger:#a32d2d;--r:14px;--rs:8px}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;padding-bottom:60px}
.topbar{background:var(--ink);color:#fff;padding:16px 20px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.topbar-title{font-size:15px;font-weight:600}
.topbar-sub{font-size:11px;color:#aaa;font-family:'DM Mono',monospace;margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;background:#444;transition:background .3s}
.dot.on{background:#5DCB9A;box-shadow:0 0 0 3px rgba(93,203,154,.2)}
.main{padding:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.flabel{font-size:12px;color:var(--ink2);margin-bottom:4px;display:block}
.fg{margin-bottom:10px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;border:1.5px solid var(--border);border-radius:var(--rs);font-family:'DM Mono',monospace;font-size:12px;background:var(--paper);color:var(--ink);outline:none;-webkit-appearance:none}
input:focus{border-color:var(--accent)}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:var(--rs);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent;transition:opacity .15s}
.btn-dark{background:var(--ink);color:#fff;margin-top:4px}
.btn-green{background:var(--accent);color:#fff}
.btn-outline{background:transparent;color:var(--ink2);border:1.5px solid var(--border)}
.btn:active{opacity:.7}
.btn:disabled{background:#bbb;cursor:not-allowed}
.btn-row{display:flex;gap:8px}
.btn-row .btn{flex:1}
.cam-box{background:#111;border-radius:var(--r);overflow:hidden;margin-bottom:12px;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center}
.cam-ph{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;padding:24px}
.cam-icon{width:56px;height:56px;background:rgba(255,255,255,.08);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px}
.cam-ph p{color:#777;font-size:14px}
.cam-ph small{color:#444;font-size:11px;font-family:'DM Mono',monospace}
#video{width:100%;height:100%;object-fit:cover;display:none}
#canvas{display:none}
#previewImg{width:100%;height:100%;object-fit:contain;display:none}
.upload-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;border:1.5px dashed var(--border);border-radius:var(--r);background:var(--paper);color:var(--ink2);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:16px;-webkit-tap-highlight-color:transparent}
.upload-btn:active{border-color:var(--accent);color:var(--accent)}
#fileInput{display:none}
.processing{text-align:center;padding:28px 16px;display:none}
.processing.show{display:block}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.processing p{font-size:14px;color:var(--ink2);font-weight:500}
.processing small{font-size:11px;color:var(--ink3);font-family:'DM Mono',monospace}
.result-card{background:var(--paper);border:1.5px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px;display:none}
.result-card.show{display:block}
.result-header{padding:14px 16px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--border)}
.badge{padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase}
.b-invoice{background:var(--al);color:var(--at)}
.b-challan{background:#e6f1fb;color:#185fa5}
.b-weigh{background:#faeeda;color:#854f0b}
.b-receipt{background:#fbeaf0;color:#993556}
.b-po{background:#eeedfe;color:#534ab7}
.b-other{background:var(--surface);color:var(--ink2)}
.conf-tag{font-size:11px;font-family:'DM Mono',monospace;color:var(--ink3);margin-left:auto}
.fields{padding:2px 0}
.frow{display:flex;padding:9px 16px;border-bottom:1px solid var(--surface);gap:8px}
.frow:last-child{border-bottom:none}
.fkey{font-size:11px;color:var(--ink3);min-width:120px;flex-shrink:0;font-family:'DM Mono',monospace;padding-top:2px}
.fval{font-size:13px;color:var(--ink);font-weight:500;word-break:break-word}
.result-actions{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
.result-actions .btn{padding:12px;font-size:14px}
.sec-label{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.history-item{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface);border-radius:var(--rs);margin-bottom:6px;font-size:13px}
.hi-type{flex:1;font-weight:500}
.hi-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3)}
.hi-st{font-size:11px;font-weight:500}
.hi-ok{color:var(--at)}
.hi-err{color:var(--danger)}
.empty{text-align:center;padding:20px;color:var(--ink3);font-size:13px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;font-weight:500;transition:transform .35s;z-index:999;max-width:88vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--accent)}
.toast.err{background:var(--danger)}
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title">Nalanda Doc Scanner</div>
    <div class="topbar-sub">NALANDA CONCRETE BLOCKS</div>
  </div>
  <div class="dot" id="dot"></div>
</div>

<div class="main">

  <div class="card">
    <div class="card-title">Configuration</div>
    <div class="fg">
      <label class="flabel">Claude API Key</label>
      <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off">
    </div>
    <div class="fg">
      <label class="flabel">Google Apps Script Web App URL</label>
      <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec">
    </div>
    <div class="fg">
      <label class="flabel">Sheet tab prefix</label>
      <input type="text" id="sheetPrefix" value="Nalanda">
    </div>
    <button class="btn btn-dark" id="btnSave" onclick="saveConfig()">Save Configuration</button>
  </div>

  <div class="cam-box" id="camBox">
    <div class="cam-ph" id="camPh" onclick="startCamera()">
      <div class="cam-icon">&#128247;</div>
      <p>Tap to open camera</p>
      <small>rear camera opens automatically</small>
    </div>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <img id="previewImg" alt="preview">
  </div>

  <div class="btn-row" style="margin-bottom:10px">
    <button class="btn btn-green" id="captureBtn" onclick="doCapture()" disabled>Capture &amp; Scan</button>
    <button class="btn btn-outline" id="retakeBtn" onclick="doRetake()" style="display:none">Retake</button>
  </div>

  <button class="upload-btn" id="uploadBtn">&#128193;&nbsp; Upload image from gallery</button>
  <input type="file" id="fileInput" accept="image/*">

  <div class="processing" id="processing">
    <div class="spinner"></div>
    <p id="pMsg">Analysing document...</p>
    <small id="pStep">Sending to Claude API</small>
  </div>

  <div class="result-card" id="resultCard">
    <div class="result-header">
      <span class="badge b-other" id="typeBadge">-</span>
      <span class="conf-tag" id="confTag"></span>
    </div>
    <div class="fields" id="fieldList"></div>
    <div class="result-actions">
      <button class="btn btn-green" id="saveBtn" onclick="doSave()">Save to Sheets</button>
      <button class="btn btn-outline" onclick="doRetake()">New Scan</button>
    </div>
  </div>

  <div class="sec-label">Recent scans</div>
  <div id="historyList"><div class="empty">No scans yet</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
var camStream = null;
var imgB64 = null;
var extracted = null;
var scanHistory = [];

try { scanHistory = JSON.parse(localStorage.getItem('scanHistory') || '[]'); } catch(e) {}

window.addEventListener('load', function() {
  var k = localStorage.getItem('claudeKey');
  var u = localStorage.getItem('scriptUrl');
  var p = localStorage.getItem('sheetPrefix');
  if (k) { document.getElementById('apiKey').value = k; setDot(true); }
  if (u) { document.getElementById('scriptUrl').value = u; }
  if (p) { document.getElementById('sheetPrefix').value = p; }
  renderHistory();
  document.getElementById('uploadBtn').addEventListener('click', function() {
    document.getElementById('fileInput').click();
  });
  document.getElementById('fileInput').addEventListener('change', function(e) {
    handleFile(e);
  });
});

function saveConfig() {
  var k = document.getElementById('apiKey').value.trim();
  var u = document.getElementById('scriptUrl').value.trim();
  var p = document.getElementById('sheetPrefix').value.trim() || 'Nalanda';
  if (!k || k.indexOf('sk-') !== 0) { showToast('Enter a valid Claude API key', 'err'); return; }
  if (!u || u.indexOf('https://script.google.com') !== 0) { showToast('Enter a valid Apps Script URL', 'err'); return; }
  localStorage.setItem('claudeKey', k);
  localStorage.setItem('scriptUrl', u);
  localStorage.setItem('sheetPrefix', p);
  setDot(true);
  showToast('Configuration saved', 'ok');
}

function setDot(on) {
  document.getElementById('dot').className = on ? 'dot on' : 'dot';
}

function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showToast('Camera not supported - use upload', 'err'); return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
    .then(function(stream) {
      camStream = stream;
      var v = document.getElementById('video');
      v.srcObject = stream;
      v.style.display = 'block';
      document.getElementById('camPh').style.display = 'none';
      document.getElementById('captureBtn').disabled = false;
    })
    .catch(function() { showToast('Camera blocked - use upload button', 'err'); });
}

function doCapture() {
  var video = document.getElementById('video');
  var canvas = document.getElementById('canvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 720;
  canvas.getContext('2d').drawImage(video, 0, 0);
  var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
  imgB64 = dataUrl.split(',')[1];
  showPreview(dataUrl);
  stopCam();
  analyseImage();
}

function handleFile(e) {
  var file = e.target.files[0];
  if (!file) return;
  e.target.value = '';
  var reader = new FileReader();
  reader.onload = function(ev) {
    var dataUrl = ev.target.result;
    imgB64 = dataUrl.split(',')[1];
    showPreview(dataUrl);
    stopCam();
    analyseImage();
  };
  reader.onerror = function() { showToast('Could not read file', 'err'); };
  reader.readAsDataURL(file);
}

function showPreview(dataUrl) {
  var img = document.getElementById('previewImg');
  img.src = dataUrl;
  img.style.display = 'block';
  document.getElementById('video').style.display = 'none';
  document.getElementById('camPh').style.display = 'none';
  document.getElementById('captureBtn').style.display = 'none';
  document.getElementById('retakeBtn').style.display = 'block';
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(function(t) { t.stop(); }); camStream = null; }
}

function doRetake() {
  stopCam();
  imgB64 = null; extracted = null;
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('camPh').style.display = 'flex';
  document.getElementById('video').style.display = 'none';
  document.getElementById('captureBtn').style.display = 'block';
  document.getElementById('captureBtn').disabled = true;
  document.getElementById('retakeBtn').style.display = 'none';
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('processing').classList.remove('show');
  document.getElementById('fileInput').value = '';
}

var AI_PROMPT = 'You are a business document scanner for Nalanda Concrete Blocks, Bengaluru. Analyse this document image and respond ONLY with valid JSON, no markdown, no extra text. Identify doc type: TAX_INVOICE, DELIVERY_CHALLAN, WEIGH_SLIP, PURCHASE_INVOICE, SALES_INVOICE, RECEIPT, PURCHASE_ORDER, CREDIT_NOTE, DEBIT_NOTE, or OTHER. Extract all visible fields like invoice_number, date, supplier_name, gstin, vehicle_number, gross_weight_kg, tare_weight_kg, net_weight_kg, material, quantity, unit_price, basic_amount, cgst, sgst, total_amount, rst_number. Return exactly: {"doc_type":"TAX_INVOICE","confidence":"HIGH","fields":{"key":"value"}}';

function analyseImage() {
  var key = localStorage.getItem('claudeKey');
  if (!key) { showToast('Add your Claude API key first', 'err'); return; }
  if (!imgB64) { showToast('No image captured', 'err'); return; }
  document.getElementById('processing').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');
  document.getElementById('pMsg').textContent = 'Analysing document...';
  document.getElementById('pStep').textContent = 'Sending to Claude API';
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: [
        { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: imgB64 } },
        { type: 'text', text: AI_PROMPT }
      ]}]
    })
  })
  .then(function(res) {
    if (!res.ok) { return res.json().then(function(e) { throw new Error(e.error ? e.error.message : 'API error ' + res.status); }); }
    return res.json();
  })
  .then(function(data) {
    var raw = data.content[0].text.trim();
    var start = raw.indexOf('{');
    var end = raw.lastIndexOf('}');
    if (start !== -1 && end !== -1) { raw = raw.substring(start, end + 1); }
    extracted = JSON.parse(raw);
    document.getElementById('processing').classList.remove('show');
    renderResult(extracted);
  })
  .catch(function(e) {
    document.getElementById('processing').classList.remove('show');
    showToast('Error: ' + e.message, 'err');
  });
}

var TYPE_LABEL = { TAX_INVOICE:'Tax Invoice', PURCHASE_INVOICE:'Purchase Invoice', SALES_INVOICE:'Sales Invoice', DELIVERY_CHALLAN:'Delivery Challan', WEIGH_SLIP:'Weigh Slip', RECEIPT:'Receipt', PURCHASE_ORDER:'Purchase Order', CREDIT_NOTE:'Credit Note', DEBIT_NOTE:'Debit Note', OTHER:'Other' };
var TYPE_BADGE = { TAX_INVOICE:'b-invoice', PURCHASE_INVOICE:'b-invoice', SALES_INVOICE:'b-invoice', DELIVERY_CHALLAN:'b-challan', WEIGH_SLIP:'b-weigh', RECEIPT:'b-receipt', PURCHASE_ORDER:'b-po' };

function toTitle(str) {
  var words = str.split('_');
  var out = [];
  for (var i = 0; i < words.length; i++) { out.push(words[i].charAt(0).toUpperCase() + words[i].slice(1)); }
  return out.join(' ');
}

function renderResult(d) {
  var badge = document.getElementById('typeBadge');
  badge.textContent = TYPE_LABEL[d.doc_type] || d.doc_type;
  badge.className = 'badge ' + (TYPE_BADGE[d.doc_type] || 'b-other');
  document.getElementById('confTag').textContent = d.confidence;
  var list = document.getElementById('fieldList');
  list.innerHTML = '';
  var fields = d.fields || {};
  var keys = Object.keys(fields);
  for (var i = 0; i < keys.length; i++) {
    var row = document.createElement('div'); row.className = 'frow';
    var kEl = document.createElement('span'); kEl.className = 'fkey'; kEl.textContent = toTitle(keys[i]);
    var vEl = document.createElement('span'); vEl.className = 'fval'; vEl.textContent = fields[keys[i]];
    row.appendChild(kEl); row.appendChild(vEl); list.appendChild(row);
  }
  document.getElementById('resultCard').classList.add('show');
}

function doSave() {
  var url = localStorage.getItem('scriptUrl');
  if (!url) { showToast('Add Apps Script URL in config first', 'err'); return; }
  if (!extracted) { showToast('No data to save', 'err'); return; }
  var prefix = localStorage.getItem('sheetPrefix') || 'Nalanda';
  var label = TYPE_LABEL[extracted.doc_type] || extracted.doc_type;
  var sheetName = prefix + ' - ' + label;
  var ts = new Date().toLocaleString('en-IN');
  var fields = extracted.fields || {};
  var keys = Object.keys(fields);
  var vals = Object.values(fields);
  var headers = ['Scanned At', 'Doc Type', 'Confidence'];
  for (var i = 0; i < keys.length; i++) { headers.push(toTitle(keys[i])); }
  var row = [ts, label, extracted.confidence].concat(vals);

  var saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true;
  saveBtn.textContent = 'Saving...';

  document.getElementById('pMsg').textContent = 'Saving to Google Sheets...';
  document.getElementById('pStep').textContent = 'Connecting to Apps Script';
  document.getElementById('processing').classList.add('show');
  document.getElementById('resultCard').classList.remove('show');

  // Use fetch without mode:no-cors so we can read the response
  // Apps Script handles CORS when deployed as "Anyone" web app
  var payload = JSON.stringify({ sheetName: sheetName, headers: headers, row: row });

  fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: payload
  })
  .then(function(res) { return res.text(); })
  .then(function(text) {
    document.getElementById('processing').classList.remove('show');
    document.getElementById('resultCard').classList.add('show');
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save to Sheets';
    var entry = { id: Date.now(), type: label, status: 'ok' };
    scanHistory.unshift(entry);
    try { localStorage.setItem('scanHistory', JSON.stringify(scanHistory.slice(0, 50))); } catch(x) {}
    renderHistory();
    showToast('Saved to ' + sheetName, 'ok');
  })
  .catch(function(err) {
    document.getElementById('processing').classList.remove('show');
    document.getElementById('resultCard').classList.add('show');
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save to Sheets';
    showToast('Save failed: ' + err.message, 'err');
    var entry = { id: Date.now(), type: label, status: 'err' };
    scanHistory.unshift(entry);
    try { localStorage.setItem('scanHistory', JSON.stringify(scanHistory.slice(0, 50))); } catch(x) {}
    renderHistory();
  });
}

function renderHistory() {
  var el = document.getElementById('historyList');
  if (!scanHistory.length) { el.innerHTML = '<div class="empty">No scans yet</div>'; return; }
  var html = '';
  var items = scanHistory.slice(0, 8);
  for (var i = 0; i < items.length; i++) {
    var h = items[i];
    var t = new Date(h.id).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    var stClass = h.status === 'ok' ? 'hi-ok' : 'hi-err';
    var stText = h.status === 'ok' ? 'saved' : 'failed';
    html += '<div class="history-item"><span class="hi-type">' + h.type + '</span><span class="hi-time">' + t + '</span><span class="hi-st ' + stClass + '">' + stText + '</span></div>';
  }
  el.innerHTML = html;
}

function showToast(msg, type) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast' + (type ? ' ' + type : '');
  t.classList.add('show');
  clearTimeout(t._tmr);
  t._tmr = setTimeout(function() { t.classList.remove('show'); }, 3000);
}
</script>
</body>
</html>
